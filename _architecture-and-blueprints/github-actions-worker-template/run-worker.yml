name: Swarm Backend Worker (Docker Runner)

on:
  workflow_dispatch:

jobs:
  run-swarm-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 🚀 Booting Distributed Swarm Worker
        run: echo "Starting Swarm Worker..."

      - name: 🐳 Pull Docker Image
        run: docker pull ghcr.io/your-username/distributed-swarm-monorepo-worker:latest

      # The Hybrid Configuration Engine dynamically fetches rclone configs from the 
      # Relay Database. We no longer need to mount local config files!
      - name: 🦾 Execute Worker Node
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          GRPC_PUBLIC_IP: ${{ secrets.GRPC_PUBLIC_IP }}
          GRPC_PORT: ${{ secrets.GRPC_PORT }}
          # Required for Phase 11: Worker-Direct Database Streaming Bypass
          GITHUB_EPHEMERAL_MONGODB_URI: ${{ secrets.GITHUB_EPHEMERAL_MONGODB_URI }}
        run: |
          docker run --rm \
            -e RELAY_URL=$RELAY_URL \
            -e WORKER_SECRET=$WORKER_SECRET \
            -e GRPC_PUBLIC_IP=$GRPC_PUBLIC_IP \
            -e GRPC_PORT=$GRPC_PORT \
            -e GITHUB_EPHEMERAL_MONGODB_URI=$GITHUB_EPHEMERAL_MONGODB_URI \
            ghcr.io/your-username/distributed-swarm-monorepo-worker:latest
