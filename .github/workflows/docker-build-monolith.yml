name: Build Monolithic Appliance Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push-monolith:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/swarm-monolith
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and Push Monolithic Image
        uses: docker/build-push-action@v4
        with:
          context: .
          # Using the root Dockerfile we just created
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/swarm-monolith:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/swarm-monolith:buildcache,mode=max